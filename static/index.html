<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Test Case Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:40px auto;padding:0 20px}.card{background:#fff;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 4px 18px #00000012}h1{margin:0 0 8px}p{color:#5c667a}textarea{width:100%;min-height:150px;box-sizing:border-box;padding:14px;border:1px solid #d7dce5;border-radius:10px;font-size:15px}button{margin-top:14px;padding:12px 20px;border:0;border-radius:9px;background:#1f6feb;color:white;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.status{font-size:13px}.case{border:1px solid #e1e5ec;border-radius:10px;padding:16px;margin:12px 0}.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.pill{background:#eef3ff;padding:5px 9px;border-radius:20px}.hidden{display:none}.error{color:#b42318}.metrics{display:flex;gap:12px;flex-wrap:wrap}.metric{padding:12px 16px;background:#f0f4fa;border-radius:10px}.trace{font-family:monospace;font-size:12px;white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:15px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>AI Test Case Generator</h1>
<p>Enter a user story. The system classifies it with TensorFlow, uses a LangChain-based agent and Generative AI to generate, validate and refine structured test cases.</p>
<textarea id="story" placeholder="As a registered user, I want to log into the application using my registered email and password so that I can access my account."></textarea>
<button id="generate" onclick="generateCases()">Generate Test Cases</button>
<p id="status" class="status"></p>
</div>
<div id="result" class="hidden"></div>
</div>
<script>
async function generateCases(){
 const story=document.getElementById('story').value.trim(), btn=document.getElementById('generate'), status=document.getElementById('status'), result=document.getElementById('result');
 if(!story){status.textContent='Please enter a user story.';return}
 btn.disabled=true;status.textContent='Generating...';result.className='hidden';
 try{
  const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_story:story})});
  const data=await r.json(); if(!r.ok) throw new Error(data.detail||'Generation failed');
  const c=data.classification,m=data.metrics;
  let html=`<div class="card"><h2>Result</h2><div class="meta"><span class="pill">Category: ${esc(c.category)}</span><span class="pill">Quality: ${esc(c.quality)}</span><span class="pill">LLM: ${esc(data.llm_status)}</span></div><div class="metrics"><div class="metric">Coverage: <b>${m.coverage_percent}%</b></div><div class="metric">Relevance: <b>${m.relevance_percent}%</b></div><div class="metric">Duplicates: <b>${m.duplicate_percent}%</b></div></div></div>`;
  html+=`<div class="card"><h2>Test Cases (${data.test_cases.length})</h2>`;
  for(const t of data.test_cases){html+=`<div class="case"><h3>${esc(t.id)} — ${esc(t.title)}</h3><div><b>Type:</b> ${esc(t.type)} &nbsp; <b>Priority:</b> ${esc(t.priority)}</div><p><b>Precondition:</b> ${esc(t.preconditions||'—')}</p><p><b>Test Data:</b> ${esc(t.test_data||'—')}</p><p><b>Steps:</b></p><ol>${(t.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p><b>Expected Result:</b> ${esc(t.expected_result||'—')}</p></div>`}
  html+='</div>';
  html+=`<div class="card"><h2>Agent Trace</h2><div class="trace">${esc(JSON.stringify(data.trace,null,2))}</div></div>`;
  result.innerHTML=html;result.className='';status.textContent='Generation completed.';
 }catch(e){status.innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{btn.disabled=false}
}
function esc(v){return String(v??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}
</script>
</body></html>
