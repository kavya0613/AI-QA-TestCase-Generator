services:
  - type: web
    name: ai-testcase-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python scripts/train_models.py --epochs 30
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: EMBEDDING_BACKEND
        value: tfidf
      - key: MAX_REFINEMENTS
        value: "2"
      - key: USE_LLM_PLANNER
        value: "true"
      - key: GOOGLE_API_KEY
        sync: false
